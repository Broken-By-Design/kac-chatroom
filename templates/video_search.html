<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>New Tab</title>
        <style>
            :root {
                --bg: #0b0e14;
                --surface: #12161f;
                --surface-2: #1a2130;
                --border: #232c3d;
                --text: #e8ebf2;
                --muted: #8f99ab;
                --accent: #7ba7ff;
                --own-grad: linear-gradient(135deg, #3f7dff, #6a5cff);
                --danger: #ff6b81;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: Roboto, "Segoe UI", -apple-system, BlinkMacSystemFont,
                    Helvetica, Arial, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(1200px 600px at 80% -10%, rgba(123, 167, 255, 0.08), transparent 60%),
                    radial-gradient(900px 500px at 0% 110%, rgba(106, 92, 255, 0.07), transparent 60%),
                    var(--bg);
                overflow: hidden;
            }

            .app {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            .topbar {
                flex: none;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 16px;
                background: var(--surface-2);
                border-bottom: 1px solid var(--border);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                user-select: none;
            }

            .brand-icon {
                display: none;
            }

            .brand-text {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: 0.3px;
            }

            .brand-text span {
                color: var(--muted);
                font-weight: 400;
            }

            .search-wrap {
                flex: 1;
                max-width: 640px;
                display: flex;
                align-items: center;
                gap: 6px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 6px 6px 6px 14px;
                margin: 0 auto;
            }

            .search-wrap:focus-within {
                border-color: var(--accent);
            }

            #searchInput {
                flex: 1;
                min-width: 0;
                background: transparent;
                border: none;
                outline: none;
                color: var(--text);
                font-size: 14px;
                font-family: inherit;
            }

            #searchInput::placeholder {
                color: var(--muted);
            }

            #searchBtn {
                background: var(--surface-2);
                color: var(--text);
                border: none;
                border-radius: 999px;
                width: 34px;
                height: 34px;
                display: grid;
                place-items: center;
                cursor: pointer;
            }

            #searchBtn:hover {
                background: #2a3448;
            }

            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--own-grad);
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                display: grid;
                place-items: center;
                text-transform: uppercase;
                flex: none;
            }

            .app-body {
                flex: 1;
                display: flex;
                min-height: 0;
            }

            .main {
                flex: 1;
                min-width: 0;
                overflow-y: auto;
                padding: 14px 18px 30px;
            }

            .view-title {
                font-size: 18px;
                font-weight: 700;
                margin: 0 0 10px;
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 14px;
            }

            .chip {
                background: var(--hover);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 7px 16px;
                font-size: 13px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                transition: background 0.12s ease, border-color 0.12s ease;
            }

            .chip:hover {
                background: #3a3a3a;
            }

            .chip.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 10px 10px;
            }

            @media (max-width: 1200px) {
                .grid {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
            }

            @media (max-width: 900px) {
                .grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }

            .video-card {
                cursor: pointer;
                min-width: 0;
            }

            .thumb-wrap {
                position: relative;
                aspect-ratio: 16 / 9;
                border-radius: 8px;
                overflow: hidden;
                background: #000;
                border: 1px solid var(--border);
            }

            .thumb {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.15s ease;
            }

            .video-card:hover .thumb {
                transform: scale(1.05);
            }

            .thumb-num {
                position: absolute;
                top: 6px;
                right: 6px;
                background: rgba(0, 0, 0, 0.8);
                color: #fff;
                font-size: 11px;
                font-weight: 600;
                padding: 2px 6px;
                border-radius: 5px;
            }

            .card-body {
                padding: 6px 3px 0;
            }

            .card-title {
                font-size: 12.5px;
                font-weight: 600;
                line-height: 1.3;
                color: var(--text);
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                margin: 0 0 3px;
            }

            .card-channel {
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                text-decoration: none;
                display: block;
            }

            .card-channel:hover {
                color: var(--text);
            }

            .card-desc {
                font-size: 12px;
                line-height: 1.45;
                color: var(--muted);
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
                margin-top: 6px;
            }

            .pager {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                margin-top: 16px;
            }

            .pager button {
                background: var(--hover);
                color: var(--text);
                border: none;
                border-radius: 18px;
                padding: 9px 20px;
                font-size: 13px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }

            .pager button:hover:not(:disabled) {
                background: #3a3a3a;
            }

            .pager button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            .page-info {
                font-size: 13px;
                color: var(--muted);
            }

            .hidden {
                display: none !important;
            }

            #homeStatus,
            #searchStatus,
            #playerStatus {
                min-height: 18px;
                font-size: 12px;
                color: var(--muted);
                font-style: italic;
                margin: 0 0 10px;
            }

            .player-box {
                max-width: 100%;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                min-height: calc(100vh - 140px);
            }

            .player-box video,
            .player-box iframe {
                display: block;
                width: 100%;
                aspect-ratio: 16 / 9;
                max-height: 78vh;
                border: none;
                border-radius: 12px;
                background: #000;
            }

            .player-title {
                font-size: 20px;
                font-weight: 700;
                color: var(--text);
                margin: 14px 0 8px;
                min-width: 0;
            }

            .player-row {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 14px;
                flex-wrap: wrap;
            }

            .quality-toggle {
                display: flex;
                align-items: center;
                gap: 6px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 3px;
                flex-shrink: 0;
                margin-top: 14px;
            }

            .quality-btn {
                background: transparent;
                color: var(--muted);
                border: none;
                border-radius: 999px;
                padding: 6px 14px;
                font-size: 12px;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
                transition: background 0.12s ease, color 0.12s ease;
            }

            .quality-btn:hover {
                color: var(--text);
            }

            .quality-btn.active {
                background: var(--accent);
                color: #fff;
            }

            .quality-note {
                font-size: 11px;
                color: var(--muted);
                font-style: italic;
                margin: 0 6px 0 2px;
                white-space: nowrap;
            }

            .fun-box {
                margin: 0 0 10px;
                max-width: 200px;
                flex-shrink: 0;
                background: var(--surface-2);
                border: 1px dashed var(--border);
                border-radius: 12px;
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .fun-text {
                font-size: 14px;
                line-height: 1.5;
                color: var(--text);
                min-height: 20px;
                font-weight: 700;
            }

            .fun-btn {
                align-self: flex-end;
                background: var(--hover);
                color: var(--text);
                border: none;
                border-radius: 16px;
                padding: 7px 16px;
                font-size: 12px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }

            .fun-btn:hover {
                background: #4d4d4d;
            }

            .clicker-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .clicker-btn {
                flex: 1;
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: 14px;
                padding: 10px 0;
                font-size: 16px;
                font-weight: 800;
                letter-spacing: 1.5px;
                font-family: inherit;
                cursor: pointer;
                transition: transform 0.07s ease, filter 0.12s ease;
                user-select: none;
            }

            .clicker-btn:hover {
                filter: brightness(1.15);
            }

            .player-meta {
                margin: 14px 0 10px;
                padding: 12px 14px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 10px;
                max-width: 720px;
                width: 100%;
                font-size: 13px;
                line-height: 1.6;
                color: var(--muted);
                white-space: pre-wrap;
                word-break: break-word;
                flex: 1 1 auto;
                min-height: 0;
            }

            .player-meta .meta-channel {
                font-weight: 700;
                color: var(--text);
                font-size: 14px;
                margin-bottom: 8px;
            }

            .player-meta .meta-title {
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                margin-bottom: 8px;
            }

            .player-meta .meta-desc {
                color: var(--muted);
            }

            #backBtn {
                background: var(--hover);
                color: var(--text);
                border: none;
                border-radius: 18px;
                padding: 9px 20px;
                font-size: 13px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }

            #backBtn:hover {
                background: #3a3a3a;
            }

            #chatPanel {
                flex: none;
                width: 320px;
                border-left: 1px solid var(--border);
                background: var(--surface);
                min-width: 0;
                display: flex;
            }

            #chatPanel iframe {
                width: 100%;
                height: 100%;
                border: none;
                background: var(--surface);
            }

            @media (max-width: 900px) {
                #chatPanel {
                    width: 100%;
                    height: 70vh;
                    border-left: none;
                    border-top: 2px solid var(--border);
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <div class="brand" id="brandBtn" title="Home">
                                        <span class="brand-text">EDU<span>tube</span></span>
                </div>
                <form id="searchForm" class="search-wrap" autocomplete="off">
                    <input id="searchInput" type="text" placeholder="Search" />
                    <button id="searchBtn" type="submit" title="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
                <div class="avatar" id="avatar">{{ nickname }}</div>
            </header>

            <div class="app-body">
                <main class="main">
                    <section id="homeView">
                        <h1 class="view-title">Recommended</h1>
                        <div id="homeChips" class="chips"></div>
                        <div id="homeStatus"></div>
                        <div id="homeGrid" class="grid"></div>
                        <div class="pager">
                            <button id="moreRecsBtn">More</button>
                        </div>
                    </section>

                    <section id="searchView" class="hidden">
                        <h1 class="view-title" id="resultsTitle"></h1>
                        <div id="searchStatus"></div>
                        <div id="resultsGrid" class="grid"></div>
                        <div class="pager">
                            <button id="prevBtn">Prev</button>
                            <span class="page-info" id="pageInfo"></span>
                            <button id="nextBtn">Next</button>
                        </div>
                    </section>

                    <section id="playerView" class="hidden">
                        <div class="player-box">
                            <div id="player"></div>
                            <div id="playerStatus"></div>
                            <div class="player-row">
                                <h2 class="player-title" id="playerTitle"></h2>
                                <div class="quality-toggle" id="qualityToggle">
                                    <button class="quality-btn" data-quality="high">1080p</button>
                                    <button class="quality-btn" data-quality="low">360p</button>
                                    <span class="quality-note" id="qualityNote"></span>
                                </div>
                                <div class="fun-box">
                                    <div class="fun-text" id="funText"></div>
                                    <div class="clicker-row">
                                        <button id="funBtn" class="clicker-btn">Click</button>
                                        <button id="funReset" class="fun-btn">reset</button>
                                    </div>
                                </div>
                            </div>
                            <div class="player-meta" id="playerMeta"></div>
                            <button id="backBtn">Back to Results</button>
                        </div>
                    </section>
                </main>

                <aside id="chatPanel">
                    <iframe src="{{ url_for('index') }}" title="Chat"></iframe>
                </aside>
            </div>
        </div>

        <div id="user-nickname" data-nickname="{{ nickname }}"></div>

        <script>
            document.title = "New Tab";
            const searchForm = document.getElementById("searchForm");
            const searchInput = document.getElementById("searchInput");
            const homeGrid = document.getElementById("homeGrid");
            const homeChips = document.getElementById("homeChips");
            const resultsGrid = document.getElementById("resultsGrid");
            const resultsTitle = document.getElementById("resultsTitle");
            const player = document.getElementById("player");
            const playerTitle = document.getElementById("playerTitle");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const pageInfo = document.getElementById("pageInfo");
            const moreRecsBtn = document.getElementById("moreRecsBtn");
            const brandBtn = document.getElementById("brandBtn");

            const PER_PAGE = 20;
            let currentAbort = null;
            let activeView = "home";
            let currentVideo = null;
            let quality = localStorage.getItem("edutube_quality") || "high";

            const recState = { q: "", results: [], continuation: "", loading: false };
            const searchState = { q: "", results: [], continuation: "", page: 1 };

            function setStatus(text) {
                const el =
                    activeView === "home"
                        ? document.getElementById("homeStatus")
                        : activeView === "player"
                        ? document.getElementById("playerStatus")
                        : document.getElementById("searchStatus");
                if (el) el.textContent = text || "";
            }

            function showView(name) {
                activeView = name;
                ["home", "search", "player"].forEach((v) => {
                    document.getElementById(v + "View").classList.toggle("hidden", v !== name);
                });
            }

            async function fetchJson(url, signal) {
                const resp = await fetch(url, { signal });
                if (!resp.ok) throw new Error(resp.status);
                return resp.json();
            }

            function makeCard(r, num) {
                const el = document.createElement("div");
                el.className = "video-card";

                const thumb = document.createElement("div");
                thumb.className = "thumb-wrap";
                const img = document.createElement("img");
                img.className = "thumb";
                img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(r.videoId) + "/mqdefault.jpg";
                img.alt = "";
                img.loading = "lazy";
                thumb.appendChild(img);

                if (num) {
                    const n = document.createElement("span");
                    n.className = "thumb-num";
                    n.textContent = num;
                    thumb.appendChild(n);
                }

                const body = document.createElement("div");
                body.className = "card-body";
                const t = document.createElement("div");
                t.className = "card-title";
                t.textContent = r.title || "Untitled";
                body.appendChild(t);
                if (r.channel || r.channelId) {
                    const ch = document.createElement("a");
                    ch.className = "card-channel";
                    ch.textContent = r.channel || "";
                    if (r.channelId) {
                        ch.href = "/channel/" + encodeURIComponent(r.channelId);
                        ch.title = "Go to channel";
                        ch.addEventListener("click", (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = ch.href;
                        });
                    }
                    body.appendChild(ch);
                }
                if (r.description) {
                    const d = document.createElement("div");
                    d.className = "card-desc";
                    d.textContent = r.description;
                    body.appendChild(d);
                }

                el.appendChild(thumb);
                el.appendChild(body);
                el.addEventListener("click", () => play(r));
                return el;
            }

            let cachedQueries = [];

            function makeChips(queries, current) {
                homeChips.innerHTML = "";
                const add = (label, q) => {
                    const b = document.createElement("button");
                    b.className = "chip" + (current === q ? " active" : "");
                    b.textContent = label;
                    b.addEventListener("click", () => loadCategory(q));
                    homeChips.appendChild(b);
                };
                add("All", "");
                (queries || []).forEach((q) => add(q, q));
            }

            async function loadCategory(q) {
                showView("home");
                if (currentAbort) currentAbort.abort();
                recState.q = q;
                recState.results = [];
                recState.continuation = "";
                moreRecsBtn.disabled = true;
                setStatus(q ? "Loading " + q + "..." : "Loading recommendations...");
                try {
                    const ac = new AbortController();
                    currentAbort = ac;
                    const data = q
                        ? await fetchJson("/api/video/search?q=" + encodeURIComponent(q), ac.signal)
                        : await fetchJson("/api/video/recommendations", ac.signal);
                    recState.results = data.results || [];
                    recState.continuation = data.continuation || "";
                    if (data.queries) cachedQueries = data.queries;
                    makeChips(cachedQueries, q);
                } catch (e) {
                    if (e.name !== "AbortError") setStatus("Couldn't load.");
                    return;
                }
                setStatus("");
                moreRecsBtn.disabled = !recState.continuation;
                moreRecsBtn.textContent = recState.continuation ? "More" : "No more";
                homeGrid.innerHTML = "";
                recState.results.forEach((r) => homeGrid.appendChild(makeCard(r, null)));
            }

            async function loadHome() {
                showView("home");
                setStatus("Loading recommendations...");
                recState.q = "";
                recState.results = [];
                recState.continuation = "";
                moreRecsBtn.disabled = true;
                try {
                    const ac = new AbortController();
                    currentAbort = ac;
                    const data = await fetchJson("/api/video/recommendations", ac.signal);
                    recState.results = data.results || [];
                    recState.continuation = data.continuation || "";
                    if (data.queries) cachedQueries = data.queries;
                    makeChips(cachedQueries, recState.q);
                } catch (e) {
                    if (e.name !== "AbortError") setStatus("Couldn't load recommendations.");
                    return;
                }
                setStatus("");
                moreRecsBtn.disabled = !recState.continuation;
                moreRecsBtn.textContent = recState.continuation ? "More" : "No more";
                homeGrid.innerHTML = "";
                recState.results.forEach((r) => homeGrid.appendChild(makeCard(r, null)));
            }

            async function moreRecs() {
                if (!recState.continuation || recState.loading) return;
                recState.loading = true;
                moreRecsBtn.disabled = true;
                setStatus("Loading more...");
                let data = null;
                try {
                    const qp = recState.q
                        ? "/api/video/search?q=" +
                          encodeURIComponent(recState.q) +
                          "&continuation=" +
                          encodeURIComponent(recState.continuation)
                        : "/api/video/recommendations?continuation=" +
                          encodeURIComponent(recState.continuation);
                    data = await fetchJson(qp);
                    recState.results = recState.results.concat(data.results || []);
                    recState.continuation = data.continuation || "";
                } catch (e) {
                    setStatus("Couldn't load more.");
                }
                recState.loading = false;
                setStatus("");
                moreRecsBtn.disabled = !recState.continuation;
                moreRecsBtn.textContent = recState.continuation ? "More" : "No more";
                if (data) {
                    (data.results || []).forEach((r) => homeGrid.appendChild(makeCard(r, null)));
                }
            }

            async function doSearch() {
                if (currentAbort) currentAbort.abort();
                const q = searchInput.value.trim();
                if (!q) return;
                searchState.q = q;
                searchState.results = [];
                searchState.continuation = "";
                searchState.page = 1;
                showView("search");
                resultsTitle.textContent = 'Results for "' + q + '"';
                setStatus("Searching...");
                try {
                    const ac = new AbortController();
                    currentAbort = ac;
                    const data = await fetchJson(
                        "/api/video/search?q=" + encodeURIComponent(q),
                        ac.signal
                    );
                    searchState.results = data.results || [];
                    searchState.continuation = data.continuation || "";
                } catch (e) {
                    if (e.name !== "AbortError") setStatus("Search failed. Try again.");
                    return;
                }
                if (!searchState.results.length) {
                    setStatus('No results for "' + q + '".');
                    renderSearchPage();
                    return;
                }
                renderSearchPage();
            }

            function renderSearchPage() {
                const page = searchState.page;
                const start = (page - 1) * PER_PAGE;
                const slice = searchState.results.slice(start, start + PER_PAGE);
                resultsGrid.innerHTML = "";
                slice.forEach((r, i) => resultsGrid.appendChild(makeCard(r, start + i + 1)));
                pageInfo.textContent = "Page " + page;
                prevBtn.disabled = page <= 1;
                nextBtn.disabled =
                    start + PER_PAGE >= searchState.results.length && !searchState.continuation;
                if (!nextBtn.disabled && searchState.continuation) {
                    nextBtn.disabled = false;
                }
            }

            prevBtn.addEventListener("click", () => {
                if (searchState.page > 1) {
                    searchState.page--;
                    renderSearchPage();
                }
            });

            nextBtn.addEventListener("click", async () => {
                const start = (searchState.page - 1) * PER_PAGE;
                if (start + PER_PAGE >= searchState.results.length && searchState.continuation) {
                    setStatus("Loading more...");
                    try {
                        const data = await fetchJson(
                            "/api/video/search?q=" +
                                encodeURIComponent(searchState.q) +
                                "&continuation=" +
                                encodeURIComponent(searchState.continuation)
                        );
                        searchState.results = searchState.results.concat(data.results || []);
                        searchState.continuation = data.continuation || "";
                        searchState.page++;
                        renderSearchPage();
                    } catch (e) {
                        setStatus("Couldn't load more.");
                    }
                    setStatus("");
                } else {
                    searchState.page++;
                    renderSearchPage();
                }
            });

            moreRecsBtn.addEventListener("click", moreRecs);

            searchForm.addEventListener("submit", (e) => {
                e.preventDefault();
                doSearch();
            });

            brandBtn.addEventListener("click", () => loadHome());

            let smashCount = 0;

            const smashBtn = document.getElementById("funBtn");
            const smashReset = document.getElementById("funReset");
            const funText = document.getElementById("funText");

            function updateSmash() {
                funText.textContent = smashCount + " smashes";
            }

            smashBtn.addEventListener("click", () => {
                smashCount++;
                updateSmash();
                smashBtn.style.transform = "scale(0.9)";
                setTimeout(() => (smashBtn.style.transform = ""), 70);
            });

            smashReset.addEventListener("click", () => {
                smashCount = 0;
                updateSmash();
            });

            updateSmash();

            function renderMeta(data, fallbackTitle) {
                const meta = document.getElementById("playerMeta");
                meta.innerHTML = "";
                const channel = data.channel || "";
                const title = data.title || fallbackTitle || "";
                const desc = data.description || "";
                if (channel || title || desc) {
                    if (channel) {
                        const ch = document.createElement("div");
                        ch.className = "meta-channel";
                        ch.textContent = channel;
                        meta.appendChild(ch);
                    }
                    if (title && title !== fallbackTitle) {
                        const t = document.createElement("div");
                        t.className = "meta-title";
                        t.textContent = title;
                        meta.appendChild(t);
                    }
                    if (desc) {
                        const d = document.createElement("div");
                        d.className = "meta-desc";
                        d.textContent = desc;
                        meta.appendChild(d);
                    }
                }
            }

            async function play(r) {
                if (currentAbort) currentAbort.abort();
                currentVideo = r;
                const ac = new AbortController();
                currentAbort = ac;
                player.innerHTML = "";
                playerTitle.textContent = r.title;
                document.getElementById("playerMeta").innerHTML = "";
                showView("player");
                updateSmash();
                for (let attempt = 1; attempt <= 3; attempt++) {
                    if (ac.signal.aborted) return;
                    setStatus(
                        attempt === 1
                            ? "Hold on, grabbing a stream..."
                            : "Trying again... (" + (attempt - 1) + "/2)"
                    );
                    try {
                        let data = {};
                        const resp = await fetch(
                            "/api/video/stream/" +
                                encodeURIComponent(r.videoId) +
                                (attempt > 1 ? "?fresh=1" : ""),
                            { signal: ac.signal }
                        );
                        if (resp.ok) data = await resp.json();
                        renderMeta(data, r.title);

                        player.innerHTML = "";
                        playerTitle.textContent = data.title || r.title;

                        const videoEl = document.createElement("video");
                        videoEl.controls = true;
                        videoEl.playsInline = true;
                        player.appendChild(videoEl);

                        // The toggle picks between two playback modes:
                        //   high (1080p DASH, muxed via MediaSource — slow seeking)
                        //   low  (360p combined, native <video> — fast seeking)
                        // Each prefers its own stream type and falls back to the
                        // other when that type isn't available.
                        if (quality === "low" && data.single && data.single.indexOf("googlevideo.com") !== -1) {
                            videoEl.src = "/api/video/relay?url=" + encodeURIComponent(data.single);
                            await playUntilCanPlay(videoEl, ac.signal);
                        } else if (data.video && data.audio) {
                            // Re-resolve fresh URLs on demand when a stream's
                            // playback URLs expire mid-video (long videos).
                            const refreshStreams = async () => {
                                const fresp = await fetch(
                                    "/api/video/stream/" +
                                        encodeURIComponent(r.videoId) +
                                        "?fresh=1",
                                    { signal: ac.signal }
                                );
                                if (!fresp.ok) return null;
                                const fdata = await fresp.json();
                                return fdata.video && fdata.audio ? fdata : null;
                            };
                            await withTimeout(playStreamPair(videoEl, data.video, data.audio, data.vcodec, data.acodec, ac.signal, refreshStreams), 20000, ac.signal);
                        } else if (data.single && data.single.indexOf("googlevideo.com") !== -1) {
                            videoEl.src = "/api/video/relay?url=" + encodeURIComponent(data.single);
                            await playUntilCanPlay(videoEl, ac.signal);
                        } else {
                            throw new Error("no stream");
                        }
                        return;
                    } catch (e) {
                        if (ac.signal.aborted) return;
                        if (attempt < 3) {
                            await new Promise((res) => setTimeout(res, attempt * 1500));
                        }
                    }
                }
                player.innerHTML =
                    '<iframe src="https://www.youtube.com/embed/' +
                    encodeURIComponent(r.videoId) +
                    '?rel=0" title="' +
                    r.title +
                    '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>';
                playerTitle.textContent = r.title;
                renderMeta({}, r.title);
                setStatus("");
            }

            const qualityBtns = document.querySelectorAll(".quality-btn");
            const qualityNote = document.getElementById("qualityNote");

            function updateQualityUI() {
                qualityBtns.forEach((b) =>
                    b.classList.toggle("active", b.dataset.quality === quality)
                );
                qualityNote.textContent =
                    quality === "high"
                        ? "1080p · seeking is slow"
                        : "360p · seeking is fast";
            }

            function setQuality(mode) {
                if (mode === quality) return;
                quality = mode;
                localStorage.setItem("edutube_quality", quality);
                updateQualityUI();
                // Rebuild the current video with the new mode.
                if (currentVideo && activeView === "player") {
                    play(currentVideo);
                }
            }

            qualityBtns.forEach((b) =>
                b.addEventListener("click", () => setQuality(b.dataset.quality))
            );
            updateQualityUI();

            // Resolves when the <video> fires canplay, or rejects on error/timeout
            // so a hung native playback doesn't lock up the page.
            function playUntilCanPlay(videoEl, signal) {
                return new Promise((res, rej) => {
                    const to = setTimeout(() => rej(new Error("timeout")), 30000);
                    const onPlay = () => {
                        clearTimeout(to);
                        signal.removeEventListener("abort", onAbort);
                        res();
                    };
                    const onErr = () => {
                        clearTimeout(to);
                        signal.removeEventListener("abort", onAbort);
                        rej(new Error("stream error"));
                    };
                    const onAbort = () => {
                        clearTimeout(to);
                        videoEl.removeEventListener("canplay", onPlay);
                        videoEl.removeEventListener("error", onErr);
                        rej(new Error("aborted"));
                    };
                    videoEl.addEventListener("canplay", onPlay, { once: true });
                    videoEl.addEventListener("error", onErr, { once: true });
                    signal.addEventListener("abort", onAbort);
                    videoEl.play().catch(() => {});
                });
            }

            // Races a promise against a timeout (honoring the abort signal) so a
            // stuck MediaSource/segment-fetch can't hang the page forever.
            function withTimeout(p, ms, signal) {
                return new Promise((res, rej) => {
                    const to = setTimeout(() => rej(new Error("timeout")), ms);
                    p.then((v) => { clearTimeout(to); res(v); }).catch((e) => { clearTimeout(to); rej(e); });
                    signal.addEventListener("abort", () => { clearTimeout(to); rej(new Error("aborted")); }, { once: true });
                });
            }

            function concatBytes(a, b) {
                const out = new Uint8Array(a.length + b.length);
                out.set(a, 0);
                out.set(b, a.length);
                return out;
            }

            function appendBufferAsync(sb, data) {
                return new Promise((res, rej) => {
                    const attempt = () => {
                        // Never append over an in-flight append.
                        if (sb.updating) {
                            sb.addEventListener(
                                "updateend",
                                () => attempt(),
                                { once: true }
                            );
                            return;
                        }
                        let timer = null;
                        let settled = false;
                        const finish = (err) => {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            sb.removeEventListener("updateend", onEnd);
                            sb.removeEventListener("error", onErr);
                            if (err) rej(err);
                            else res();
                        };
                        const onEnd = () => finish(null);
                        const onErr = () => finish(new Error("sourceBuffer error"));
                        try {
                            sb.appendBuffer(data);
                            timer = setTimeout(
                                () => finish(new Error("append timeout")),
                                30000
                            );
                            sb.addEventListener("updateend", onEnd);
                            sb.addEventListener("error", onErr);
                        } catch (e) {
                            if (e && e.name === "QuotaExceededError") {
                                // MediaSource is at the browser's memory cap.
                                // Playback / MSE eviction will free room shortly;
                                // wait and retry instead of killing the muxer.
                                setTimeout(attempt, 1000);
                            } else {
                                finish(e);
                            }
                        }
                    };
                    attempt();
                });
            }

            function bufferedAhead(videoEl) {
                const t = videoEl.currentTime;
                for (let i = 0; i < videoEl.buffered.length; i++) {
                    if (t >= videoEl.buffered.start(i) && t <= videoEl.buffered.end(i)) {
                        return videoEl.buffered.end(i) - t;
                    }
                }
                return 0;
            }

            function sleep(ms) {
                return new Promise((res) => setTimeout(res, ms));
            }

            // fetch with a hard timeout so a stalled relay/upstream can't hang
            // the chunk loop forever (which otherwise drains the buffer and
            // stalls the video).
            function fetchWithTimeout(url, opts, ms) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), ms);
                const outer = opts.signal;
                const onOuterAbort = () => ctrl.abort();
                if (outer) outer.addEventListener("abort", onOuterAbort);
                return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => {
                    clearTimeout(timer);
                    if (outer) outer.removeEventListener("abort", onOuterAbort);
                });
            }

            async function appendBoxes(videoEl, sb, relayUrl, onFirstSegment, signal, refresh) {
                // YouTube throttles a single continuous DASH transfer to a crawl
                // after ~20MB, but every fresh bounded range request bursts fast.
                // Fetch in 10MB chunks with a new request per chunk.
                const CHUNK = 10 * 1024 * 1024;
                let streamPos = 0;            // absolute offset of buf[0]
                let buf = new Uint8Array(0);  // only the trailing partial box
                let init = new Uint8Array(0);
                let gotInit = false;
                let pending = null;
                let segStart = -1;
                let firstDone = false;
                let refetches = 0;
                let refreshes = 0;
                const MAX_REFETCHES = 3;
                const MAX_REFRESHES = 5;

                while (true) {
                    if (signal.aborted) throw new Error("aborted");
                    // Pause between chunks once we have a healthy buffer (~2 min ahead).
                    while (firstDone && (videoEl.paused || bufferedAhead(videoEl) > 120)) {
                        if (signal.aborted) throw new Error("aborted");
                        await sleep(120);
                    }
                    const nextByte = streamPos + buf.length;
                    const endByte = nextByte + CHUNK - 1;
                    const beforeLen = buf.length;
                    let chunk;
                    let expected = -1;
                    try {
                        const resp = await fetchWithTimeout(relayUrl, {
                            headers: { Range: "bytes=" + nextByte + "-" + endByte },
                            signal,
                        }, 30000);
                        if (resp.status === 403 || resp.status === 404) throw new Error("expired");
                        if (!resp.ok) throw new Error("relay " + resp.status);
                        const cr = resp.headers.get("Content-Range");
                        if (cr) {
                            const m = cr.match(/\/(\d+)$/);
                            if (m) expected = parseInt(m[1], 10);
                        }
                        chunk = new Uint8Array(await resp.arrayBuffer());
                    } catch (e) {
                        if (signal.aborted) throw e;
                        if (++refetches > MAX_REFETCHES) {
                            // URL expired / rate-limited / relay hung: get a fresh
                            // URL and resume from the same byte position. The new
                            // URL serves the identical file, so MSE appends stay
                            // contiguous.
                            refetches = 0;
                            if (++refreshes > MAX_REFRESHES) throw e;
                            const fresh = refresh ? await refresh() : null;
                            if (!fresh) throw e;
                            relayUrl = fresh;
                            continue;
                        }
                        streamPos = segStart !== -1 ? segStart : streamPos - buf.length;
                        pending = null;
                        segStart = -1;
                        buf = new Uint8Array(0);
                        continue;
                    }
                    // Merge the trailing partial box with the new chunk in one
                    // copy (the old per-read concatBytes was O(n^2) and froze the
                    // page on the main thread for large boxes). streamPos is
                    // unchanged here: buf[0] still sits at streamPos, and each
                    // consumed box advances it below.
                    if (buf.length === 0) {
                        buf = chunk;
                    } else {
                        const merged = new Uint8Array(buf.length + chunk.length);
                        merged.set(buf, 0);
                        merged.set(chunk, buf.length);
                        buf = merged;
                    }
                    let offset = 0;
                    while (buf.length - offset >= 8) {
                        let size =
                            (buf[offset] << 24) | (buf[offset + 1] << 16) | (buf[offset + 2] << 8) | buf[offset + 3];
                        if (size === 1) {
                            if (buf.length - offset < 16) break;
                            size =
                                (((buf[offset + 8] << 24) | (buf[offset + 9] << 16) | (buf[offset + 10] << 8) | buf[offset + 11]) >>> 0) *
                                    4294967296 +
                                (((buf[offset + 12] << 24) | (buf[offset + 13] << 16) | (buf[offset + 14] << 8) | buf[offset + 15]) >>> 0);
                        } else if (size === 0) {
                            size = buf.length - offset;
                        }
                        if (buf.length - offset < size) break; // partial box, wait for more
                        const box = buf.subarray(offset, offset + size);
                        offset += size;
                        streamPos += size;
                        const type = String.fromCharCode(box[4], box[5], box[6], box[7]);
                        if (!gotInit) {
                            if (type === "moof") {
                                gotInit = true;
                                await appendBufferAsync(sb, init);
                                init = null;
                                pending = box;
                                segStart = streamPos - size;
                            } else {
                                const nb = new Uint8Array(init.length + size);
                                nb.set(init, 0);
                                nb.set(box, init.length);
                                init = nb;
                            }
                        } else if (type === "moof") {
                            pending = box;
                            segStart = streamPos - size;
                        } else if (type === "mdat") {
                            const seg = pending ? concatBytes(pending, box) : box;
                            pending = null;
                            segStart = -1;
                            await appendBufferAsync(sb, seg);
                            if (!firstDone) {
                                firstDone = true;
                                if (onFirstSegment) onFirstSegment();
                            }
                        }
                    }
                    // Keep only the trailing partial box.
                    buf = buf.subarray(offset);
                    // If we've consumed everything, we're done.
                    if (expected !== -1 && streamPos >= expected) {
                        if (pending) await appendBufferAsync(sb, pending);
                        return;
                    }
                    // Guard against a server that returns nothing (infinite loop).
                    if (streamPos + buf.length <= nextByte && buf.length <= beforeLen) {
                        if (++refetches > MAX_REFETCHES) throw new Error("no progress");
                        continue;
                    }
                    // Partial box bytes are still in buf; next chunk resumes at
                    // streamPos + buf.length. If buf is empty the chunk ended on
                    // a box boundary and we simply fetch the next chunk.
                }
            }

            async function playStreamPair(videoEl, videoUrl, audioUrl, vcodec, acodec, signal, refresh) {
                const relay = (u) => "/api/video/relay?url=" + encodeURIComponent(u);
                const ms = new MediaSource();
                const blobUrl = URL.createObjectURL(ms);
                videoEl.src = blobUrl;
                try {
                    await new Promise((res, rej) => {
                        ms.addEventListener("sourceopen", res, { once: true });
                        ms.addEventListener("error", rej, { once: true });
                    });
                    const vSB = ms.addSourceBuffer(
                        'video/mp4; codecs="' + (vcodec || "avc1.640028") + '"'
                    );
                    const aSB = ms.addSourceBuffer(
                        'audio/mp4; codecs="' + (acodec || "mp4a.40.2") + '"'
                    );

                    let vFirst = false;
                    let aFirst = false;
                    let settleStarted = null;
                    const started = new Promise((res, rej) => {
                        settleStarted = { res, rej };
                    });
                    const maybeStart = () => {
                        if (vFirst && aFirst) {
                            setStatus("");
                            videoEl.play().catch(() => {});
                            if (settleStarted) {
                                settleStarted.res();
                                settleStarted = null;
                            }
                        }
                    };

                    // On a dead URL (expired/rate-limited), re-resolve fresh
                    // playback URLs and resume from the same byte offset.
                    const refreshFor = (key) => async () => {
                        const fresh = await refresh();
                        return fresh && fresh[key] ? relay(fresh[key]) : null;
                    };

                    // Fetch/append both streams in the background (they
                    // self-throttle to ~2 min of buffered-ahead). Resolve once
                    // playback has actually begun, NOT when the whole file is
                    // downloaded — a long video would otherwise never finish
                    // buffering and get killed by the caller's timeout.
                    const done = Promise.all([
                        appendBoxes(videoEl, vSB, relay(videoUrl), () => {
                            vFirst = true;
                            maybeStart();
                        }, signal, refreshFor("video")),
                        appendBoxes(videoEl, aSB, relay(audioUrl), () => {
                            aFirst = true;
                            maybeStart();
                        }, signal, refreshFor("audio")),
                    ]);
                    // Fail fast if both streams die before playback begins so the caller
                    // can fall back. Once playing, the buffered data keeps
                    // playing out and the URL-refresh in appendBoxes already
                    // recovers the common failure; don't spam a misleading
                    // "expired" status over live playback.
                    done.catch((e) => {
                        if (signal.aborted) return;
                        if (settleStarted) {
                            settleStarted.rej(e);
                            settleStarted = null;
                        }
                    });
                    await started;
                    done.then(() => {
                        if (ms.readyState === "open") ms.endOfStream();
                    }).catch(() => {});
                } catch (e) {
                    URL.revokeObjectURL(blobUrl);
                    throw e;
                }
            }

            document.getElementById("backBtn").addEventListener("click", () => {
                player.innerHTML = "";
                if (searchState.q) {
                    showView("search");
                    renderSearchPage();
                } else {
                    loadHome();
                }
            });

            // Deep link from a channel page (or anywhere): /video-search-d6eca0?v=<id>
            // jumps straight into the player for that video.
            const params = new URLSearchParams(window.location.search);
            const deepId = params.get("v");
            if (deepId) {
                loadHome();
                play({
                    videoId: deepId,
                    title: params.get("title") || "",
                    channel: params.get("channel") || "",
                });
            } else {
                loadHome();
            }
        </script>
    </body>
</html>
