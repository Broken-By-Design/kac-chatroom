<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>New Tab</title>
        <style>
            :root {
                --bg: #0b0e14;
                --surface: #12161f;
                --surface-2: #1a2130;
                --border: #232c3d;
                --text: #e8ebf2;
                --muted: #8f99ab;
                --accent: #7ba7ff;
                --own-grad: linear-gradient(135deg, #3f7dff, #6a5cff);
                --danger: #ff6b81;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
                    Helvetica, Arial, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(1200px 600px at 80% -10%, rgba(123, 167, 255, 0.08), transparent 60%),
                    radial-gradient(900px 500px at 0% 110%, rgba(106, 92, 255, 0.07), transparent 60%),
                    var(--bg);
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .video-page {
                width: 100%;
                max-width: 760px;
                margin: 0 auto;
                padding: 24px 18px 40px;
            }

            .video-title {
                font-size: 22px;
                font-weight: 700;
                color: var(--accent);
                text-align: center;
                margin: 0 0 18px;
                letter-spacing: 0.5px;
            }

            .search-row {
                display: flex;
                gap: 10px;
                align-items: flex-end;
                margin-bottom: 10px;
            }

            #searchInput {
                flex: 1;
                min-width: 0;
                min-height: 44px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 10px 14px;
                color: var(--text);
                font-size: 14px;
                font-family: inherit;
            }

            #searchInput::placeholder {
                color: var(--muted);
            }

            #searchInput:focus {
                outline: none;
                border-color: var(--accent);
            }

            #searchBtn {
                flex: none;
                background: var(--own-grad);
                color: #fff;
                border: none;
                border-radius: 10px;
                padding: 13px 20px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
            }

            #searchBtn:active {
                opacity: 0.85;
            }

            #statusLine {
                text-align: center;
                height: 18px;
                font-size: 12px;
                color: var(--muted);
                font-style: italic;
                margin-bottom: 8px;
            }

            .results {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .result-card {
                display: flex;
                gap: 12px;
                align-items: center;
                background: var(--surface-2);
                border: 1px solid var(--border);
                padding: 10px 14px;
                border-radius: 4px 14px 14px 14px;
                cursor: pointer;
                transition: border-color 0.15s ease, background-color 0.15s ease;
                min-width: 0;
            }

            .result-card:hover {
                border-color: var(--accent);
                background: #202a3d;
            }

            .result-num {
                flex: none;
                font-weight: 700;
                color: var(--accent);
                font-size: 15px;
                width: 24px;
                text-align: center;
            }

            .result-thumb {
                flex: none;
                width: 128px;
                height: 72px;
                object-fit: cover;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: #000;
            }

            .result-text {
                min-width: 0;
            }

            .result-title {
                font-size: 14px;
                font-weight: 600;
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .result-channel {
                font-size: 12px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .player-box {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 14px;
            }

            .player-box video,
            .player-box iframe {
                display: block;
                width: 100%;
                height: 420px;
                max-height: 60vh;
                border: none;
                border-radius: 8px;
                background: #000;
            }

            .player-title {
                font-size: 14px;
                font-weight: 600;
                color: var(--accent);
                margin: 12px 0 0;
            }

            #newSearchBtn {
                margin-top: 12px;
                width: 100%;
                background: var(--surface-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 10px 16px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                font-family: inherit;
            }

            #newSearchBtn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <main class="video-page">
            <h1 class="video-title">Video Search</h1>

            <div class="search-row">
                <input id="searchInput" type="text" placeholder="Search YouTube..." autocomplete="off" />
                <button id="searchBtn">Search</button>
            </div>

            <div id="statusLine"></div>

            <div id="results" class="results"></div>

            <div id="playerWrap" class="player-box hidden">
                <div id="player"></div>
                <h2 class="player-title" id="playerTitle"></h2>
                <button id="newSearchBtn">Back to Results</button>
            </div>
        </main>

        <script>
            const searchInput = document.getElementById("searchInput");
            const searchBtn = document.getElementById("searchBtn");
            const statusLine = document.getElementById("statusLine");
            const resultsEl = document.getElementById("results");
            const playerWrap = document.getElementById("playerWrap");
            const player = document.getElementById("player");
            const playerTitle = document.getElementById("playerTitle");
            const newSearchBtn = document.getElementById("newSearchBtn");

            let currentAbort = null;

            function setStatus(text) {
                statusLine.textContent = text || "";
            }

            async function search() {
                if (currentAbort) currentAbort.abort();
                const q = searchInput.value.trim();
                if (!q) return;
                playerWrap.classList.add("hidden");
                resultsEl.innerHTML = "";
                setStatus("Searching...");
                let results = [];
                try {
                    const resp = await fetch("/api/video/search?q=" + encodeURIComponent(q));
                    if (!resp.ok) throw new Error(resp.status);
                    results = await resp.json();
                } catch (e) {
                    setStatus("Search failed. Try again.");
                    return;
                }
                if (!results.length) {
                    setStatus('No results for "' + q + '".');
                    return;
                }
                setStatus("");
                results.forEach((r, i) => {
                    const card = document.createElement("div");
                    card.className = "result-card";
                    card.innerHTML =
                        '<span class="result-num">' +
                        (i + 1) +
                        '</span><img class="result-thumb" src="https://i.ytimg.com/vi/' +
                        encodeURIComponent(r.videoId) +
                        '/mqdefault.jpg" alt="" loading="lazy"><div class="result-text"><div class="result-title">' +
                        r.title +
                        '</div><div class="result-channel">' +
                        r.channel +
                        "</div></div>";
                    card.addEventListener("click", () => play(r));
                    resultsEl.appendChild(card);
                });
            }

            async function play(r) {
                if (currentAbort) currentAbort.abort();
                const ac = new AbortController();
                currentAbort = ac;
                resultsEl.innerHTML = "";
                playerWrap.classList.add("hidden");
                for (let attempt = 1; attempt <= 3; attempt++) {
                    if (ac.signal.aborted) return;
                    setStatus(
                        attempt === 1
                            ? "Hold on, grabbing a stream..."
                            : "Trying again... (" + (attempt - 1) + "/2)"
                    );
                    try {
                        let data = {};
                        const resp = await fetch(
                            "/api/video/stream/" +
                                encodeURIComponent(r.videoId) +
                                (attempt > 1 ? "?fresh=1" : ""),
                            { signal: ac.signal }
                        );
                        if (resp.ok) data = await resp.json();

                        player.innerHTML = "";
                        playerTitle.textContent = r.title;
                        playerWrap.classList.remove("hidden");
                        setStatus("Loading stream...");

                        const videoEl = document.createElement("video");
                        videoEl.controls = true;
                        videoEl.playsInline = true;
                        player.appendChild(videoEl);

                        if (data.video && data.audio) {
                            await playStreamPair(videoEl, data.video, data.audio, data.vcodec, data.acodec, ac.signal);
                        } else if (data.single && data.single.indexOf("googlevideo.com") !== -1) {
                            videoEl.src = data.single;
                            videoEl.play().catch(() => {});
                            await new Promise((res, rej) => {
                                const to = setTimeout(() => rej(new Error("timeout")), 30000);
                                videoEl.addEventListener("canplay", () => {
                                    clearTimeout(to);
                                    setStatus("");
                                    res();
                                }, { once: true });
                                videoEl.addEventListener("error", () => {
                                    clearTimeout(to);
                                    rej(new Error("stream error"));
                                }, { once: true });
                            });
                        } else {
                            throw new Error("no stream");
                        }
                        return;
                    } catch (e) {
                        if (ac.signal.aborted) return;
                        if (attempt < 3) {
                            await new Promise((res) => setTimeout(res, attempt * 1500));
                        }
                    }
                }
                // give up: stream expired or unreachable, so fall back to the embed
                player.innerHTML =
                    '<iframe src="https://www.youtube.com/embed/' +
                    encodeURIComponent(r.videoId) +
                    '?rel=0" title="' +
                    r.title +
                    '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>';
                playerTitle.textContent = r.title;
                playerWrap.classList.remove("hidden");
                setStatus("");
            }

            function concatBytes(a, b) {
                const out = new Uint8Array(a.length + b.length);
                out.set(a, 0);
                out.set(b, a.length);
                return out;
            }

            function appendBufferAsync(sb, data) {
                return new Promise((res, rej) => {
                    let settled = false;
                    const finish = (err) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        sb.removeEventListener("updateend", onEnd);
                        sb.removeEventListener("error", onErr);
                        if (err) rej(err);
                        else res();
                    };
                    const onEnd = () => finish(null);
                    const onErr = () => finish(new Error("sourceBuffer error"));
                    const timer = setTimeout(
                        () => finish(new Error("append timeout")),
                        15000
                    );
                    sb.addEventListener("updateend", onEnd);
                    sb.addEventListener("error", onErr);
                    try {
                        sb.appendBuffer(data);
                    } catch (e) {
                        finish(e);
                    }
                });
            }

            function bufferedAhead(videoEl) {
                const t = videoEl.currentTime;
                for (let i = 0; i < videoEl.buffered.length; i++) {
                    if (t >= videoEl.buffered.start(i) && t <= videoEl.buffered.end(i)) {
                        return videoEl.buffered.end(i) - t;
                    }
                }
                return 0;
            }

            function sleep(ms) {
                return new Promise((res) => setTimeout(res, ms));
            }

            // Streams an fMP4 body box-by-box into a MediaSource buffer.
            // While the video is paused or buffered far enough ahead, reading
            // stops (natural network backpressure), so a paused tab doesn't keep
            // draining the whole file. If the upstream connection dies or the
            // body ends early (URL expiry / mid-stream drop), it re-fetches from
            // the exact byte offset and keeps appending seamlessly.
            async function appendBoxes(videoEl, sb, relayUrl, onFirstSegment, signal) {
                let streamPos = 0;
                let buf = new Uint8Array(0);
                let init = new Uint8Array(0);
                let gotInit = false;
                let pending = null;
                let segStart = -1;
                let firstDone = false;
                let refetches = 0;
                const MAX_REFETCHES = 3;

                while (true) {
                    const resp = await fetch(relayUrl, {
                        headers: { Range: "bytes=" + streamPos + "-" },
                        signal,
                    });
                    if (resp.status === 403 || resp.status === 404) throw new Error("expired");
                    if (!resp.ok) throw new Error("relay " + resp.status);
                    const reader = resp.body.getReader();
                    let expected = -1;
                    const cr = resp.headers.get("Content-Range");
                    if (cr) {
                        const m = cr.match(/\/(\d+)$/);
                        if (m) expected = parseInt(m[1], 10);
                    }
                    try {
                        while (true) {
                            while (
                                firstDone &&
                                (videoEl.paused || bufferedAhead(videoEl) > 300)
                            ) {
                                if (signal.aborted) throw new Error("aborted");
                                await sleep(250);
                            }
                            const { value, done } = await reader.read();
                            if (value) buf = concatBytes(buf, value);
                            while (buf.length >= 8) {
                                let size =
                                    (buf[0] << 24) | (buf[1] << 16) | (buf[2] << 8) | buf[3];
                                if (size === 1) {
                                    if (buf.length < 16) break;
                                    size =
                                        (((buf[8] << 24) | (buf[9] << 16) | (buf[10] << 8) | buf[11]) >>> 0) *
                                            4294967296 +
                                        (((buf[12] << 24) | (buf[13] << 16) | (buf[14] << 8) | buf[15]) >>> 0);
                                    if (buf.length < 16 + (size - 16)) break;
                                } else if (size === 0) {
                                    size = buf.length;
                                }
                                if (buf.length < size) break;
                                const box = buf.subarray(0, size);
                                buf = buf.subarray(size);
                                streamPos += size;
                                const type = String.fromCharCode(box[4], box[5], box[6], box[7]);
                                if (!gotInit) {
                                    if (type === "moof") {
                                        gotInit = true;
                                        await appendBufferAsync(sb, init);
                                        init = null;
                                        pending = box;
                                        segStart = streamPos - size;
                                    } else {
                                        init = concatBytes(init, box);
                                    }
                                } else if (type === "moof") {
                                    pending = box;
                                    segStart = streamPos - size;
                                } else if (type === "mdat") {
                                    const seg = pending ? concatBytes(pending, box) : box;
                                    pending = null;
                                    segStart = -1;
                                    await appendBufferAsync(sb, seg);
                                    if (!firstDone) {
                                        firstDone = true;
                                        if (onFirstSegment) onFirstSegment();
                                    }
                                }
                            }
                            if (done) break;
                        }
                    } catch (e) {
                        if (signal.aborted) throw e;
                        if (++refetches > MAX_REFETCHES) throw e;
                        streamPos = segStart !== -1 ? segStart : streamPos - buf.length;
                        pending = null;
                        segStart = -1;
                        buf = new Uint8Array(0);
                        continue;
                    }
                    if (expected !== -1 && streamPos < expected) {
                        if (++refetches > MAX_REFETCHES) throw new Error("truncated");
                        streamPos = segStart !== -1 ? segStart : streamPos - buf.length;
                        pending = null;
                        segStart = -1;
                        buf = new Uint8Array(0);
                        continue;
                    }
                    if (pending) await appendBufferAsync(sb, pending);
                    return;
                }
            }

            async function playStreamPair(videoEl, videoUrl, audioUrl, vcodec, acodec, signal) {
                const relay = (u) => "/api/video/relay?url=" + encodeURIComponent(u);
                const ms = new MediaSource();
                const blobUrl = URL.createObjectURL(ms);
                videoEl.src = blobUrl;
                try {
                    await new Promise((res, rej) => {
                        ms.addEventListener("sourceopen", res, { once: true });
                        ms.addEventListener("error", rej, { once: true });
                    });
                    const vSB = ms.addSourceBuffer(
                        'video/mp4; codecs="' + (vcodec || "avc1.640028") + '"'
                    );
                    const aSB = ms.addSourceBuffer(
                        'audio/mp4; codecs="' + (acodec || "mp4a.40.2") + '"'
                    );

                    let vFirst = false;
                    let aFirst = false;
                    const maybeStart = () => {
                        if (vFirst && aFirst) {
                            setStatus("");
                            videoEl.play().catch(() => {});
                        }
                    };

                    await Promise.all([
                        appendBoxes(videoEl, vSB, relay(videoUrl), () => {
                            vFirst = true;
                            maybeStart();
                        }, signal),
                        appendBoxes(videoEl, aSB, relay(audioUrl), () => {
                            aFirst = true;
                            maybeStart();
                        }, signal),
                    ]);

                    if (ms.readyState === "open") ms.endOfStream();
                } catch (e) {
                    URL.revokeObjectURL(blobUrl);
                    throw e;
                }
            }

            searchBtn.addEventListener("click", search);
            newSearchBtn.addEventListener("click", () => {
                playerWrap.classList.add("hidden");
                player.innerHTML = "";
                search();
            });
            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") search();
            });
            searchInput.focus();
        </script>
    </body>
</html>
