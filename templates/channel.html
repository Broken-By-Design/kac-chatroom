<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Channel</title>
        <style>
            :root {
                --bg: #0b0e14;
                --surface: #12161f;
                --surface-2: #1a2130;
                --border: #232c3d;
                --text: #e8ebf2;
                --muted: #8f99ab;
                --accent: #7ba7ff;
                --own-grad: linear-gradient(135deg, #3f7dff, #6a5cff);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: Roboto, "Segoe UI", -apple-system, BlinkMacSystemFont,
                    Helvetica, Arial, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(1200px 600px at 80% -10%, rgba(123, 167, 255, 0.08), transparent 60%),
                    radial-gradient(900px 500px at 0% 110%, rgba(106, 92, 255, 0.07), transparent 60%),
                    var(--bg);
                min-height: 100vh;
            }

            .topbar {
                height: 56px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 16px;
                background: var(--surface-2);
                border-bottom: 1px solid var(--border);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                user-select: none;
                text-decoration: none;
                color: var(--text);
            }

            .brand-text {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: 0.3px;
            }

            .brand-text span {
                color: var(--muted);
                font-weight: 400;
            }

            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--own-grad);
                color: #fff;
                font-weight: 700;
                font-size: 13px;
                display: grid;
                place-items: center;
                text-transform: uppercase;
                flex: none;
                margin-left: auto;
            }

            .banner {
                height: 160px;
                background: var(--surface-2);
                background-size: cover;
                background-position: center;
                border-bottom: 1px solid var(--border);
            }

            .banner.loading {
                display: none;
            }

            .channel-head {
                display: flex;
                align-items: center;
                gap: 18px;
                padding: 20px 24px;
                flex-wrap: wrap;
            }

            .channel-avatar {
                width: 92px;
                height: 92px;
                border-radius: 50%;
                object-fit: cover;
                background: var(--surface-2);
                border: 2px solid var(--border);
                flex: none;
            }

            .channel-avatar.placeholder {
                display: grid;
                place-items: center;
                font-size: 34px;
                font-weight: 800;
                color: var(--accent);
                text-transform: uppercase;
            }

            .channel-info {
                min-width: 0;
            }

            .channel-title {
                font-size: 24px;
                font-weight: 800;
                margin: 0 0 4px;
            }

            .channel-handle {
                font-size: 14px;
                color: var(--muted);
                margin: 0 0 8px;
            }

            .channel-stats {
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 13px;
                color: var(--muted);
            }

            .channel-desc {
                font-size: 13px;
                line-height: 1.55;
                color: var(--muted);
                white-space: pre-wrap;
                word-break: break-word;
                margin: 0;
                max-width: 720px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                cursor: pointer;
            }

            .channel-desc.open {
                -webkit-line-clamp: unset;
            }

            .main {
                padding: 14px 18px 30px;
            }

            .section-title {
                font-size: 18px;
                font-weight: 700;
                margin: 0 0 10px;
            }

            .status {
                min-height: 18px;
                font-size: 12px;
                color: var(--muted);
                font-style: italic;
                margin: 0 0 10px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 10px 10px;
            }

            @media (max-width: 1200px) {
                .grid {
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                }
            }

            @media (max-width: 900px) {
                .grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }

            .video-card {
                cursor: pointer;
                min-width: 0;
            }

            .thumb-wrap {
                position: relative;
                aspect-ratio: 16 / 9;
                border-radius: 8px;
                overflow: hidden;
                background: #000;
                border: 1px solid var(--border);
            }

            .thumb {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.15s ease;
            }

            .video-card:hover .thumb {
                transform: scale(1.05);
            }

            .card-body {
                padding: 6px 3px 0;
            }

            .card-title {
                font-size: 12.5px;
                font-weight: 600;
                line-height: 1.3;
                color: var(--text);
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                margin: 0 0 3px;
            }

            .pager {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                margin-top: 16px;
            }

            .pager button {
                background: var(--surface-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 9px 20px;
                font-size: 13px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }

            .pager button:hover:not(:disabled) {
                background: #2a3448;
            }

            .pager button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <a class="brand" id="brandBtn" href="/video-search-d6eca0" title="Back to EDUtube">
                <span class="brand-text">EDU<span>tube</span></span>
            </a>
            <div class="avatar" id="avatar">{{ nickname }}</div>
        </header>

        <section id="channelHead" class="hidden">
            <div class="banner" id="banner"></div>
            <div class="channel-head">
                <img class="channel-avatar hidden" id="avatarImg" alt="" />
                <div class="channel-avatar placeholder hidden" id="avatarPlaceholder">?</div>
                <div class="channel-info">
                    <h1 class="channel-title" id="channelTitle"></h1>
                    <p class="channel-handle" id="channelHandle"></p>
                    <div class="channel-stats" id="channelStats"></div>
                    <p class="channel-desc hidden" id="channelDesc"></p>
                </div>
            </div>
        </section>

        <main class="main">
            <h2 class="section-title">Videos</h2>
            <div class="status" id="status"></div>
            <div class="grid" id="grid"></div>
            <div class="pager">
                <button id="moreBtn">More</button>
            </div>
        </main>

        <script>
            const channelId = {{ channelId }};
            const grid = document.getElementById("grid");
            const statusEl = document.getElementById("status");
            const moreBtn = document.getElementById("moreBtn");

            let continuation = "";
            let loading = false;

            function setStatus(text) {
                statusEl.textContent = text || "";
            }

            function makeCard(r) {
                const el = document.createElement("div");
                el.className = "video-card";

                const thumb = document.createElement("div");
                thumb.className = "thumb-wrap";
                const img = document.createElement("img");
                img.className = "thumb";
                img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(r.videoId) + "/mqdefault.jpg";
                img.alt = "";
                img.loading = "lazy";
                thumb.appendChild(img);

                const body = document.createElement("div");
                body.className = "card-body";
                const t = document.createElement("div");
                t.className = "card-title";
                t.textContent = r.title || "Untitled";
                body.appendChild(t);

                el.appendChild(thumb);
                el.appendChild(body);
                el.addEventListener("click", () => {
                    window.location.href =
                        "/video-search-d6eca0?v=" +
                        encodeURIComponent(r.videoId) +
                        "&title=" +
                        encodeURIComponent(r.title || "") +
                        "&channel=" +
                        encodeURIComponent(r.channel || "");
                });
                return el;
            }

            function renderChannel(info) {
                document.getElementById("channelHead").classList.remove("hidden");

                const banner = document.getElementById("banner");
                if (info && info.banner) {
                    banner.classList.remove("loading");
                    banner.style.backgroundImage = "url('" + info.banner + "')";
                } else {
                    banner.classList.add("loading");
                }

                const avatarImg = document.getElementById("avatarImg");
                const avatarPlaceholder = document.getElementById("avatarPlaceholder");
                if (info && info.thumb) {
                    avatarImg.src = info.thumb;
                    avatarImg.classList.remove("hidden");
                    avatarPlaceholder.classList.add("hidden");
                } else {
                    avatarImg.classList.add("hidden");
                    avatarPlaceholder.classList.remove("hidden");
                    avatarPlaceholder.textContent = info && info.title ? info.title.charAt(0) : "?";
                }

                document.getElementById("channelTitle").textContent =
                    info && info.title ? info.title : "Channel";
                document.title = (info && info.title ? info.title : "Channel") + " - EDUtube";

                const handle = document.getElementById("channelHandle");
                if (info && info.handle) {
                    handle.textContent = info.handle;
                    handle.classList.remove("hidden");
                } else {
                    handle.classList.add("hidden");
                }

                const stats = [];
                if (info && info.subscribers) stats.push(info.subscribers);
                if (info && info.videoCount) stats.push(info.videoCount);
                document.getElementById("channelStats").textContent = stats.join("  ·  ");

                const desc = document.getElementById("channelDesc");
                if (info && info.description) {
                    desc.textContent = info.description;
                    desc.classList.remove("hidden");
                    desc.addEventListener("click", () => desc.classList.toggle("open"));
                } else {
                    desc.classList.add("hidden");
                }
            }

            async function fetchJson(url) {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(resp.status);
                return resp.json();
            }

            async function loadMore(initial) {
                if (loading) return;
                loading = true;
                moreBtn.disabled = true;
                setStatus(initial ? "Loading channel..." : "Loading more...");
                try {
                    const data = initial
                        ? await fetchJson("/api/channel/" + encodeURIComponent(channelId))
                        : await fetchJson(
                              "/api/channel/" +
                                  encodeURIComponent(channelId) +
                                  "/videos?continuation=" +
                                  encodeURIComponent(continuation)
                          );
                    if (initial && data.info) renderChannel(data.info);
                    (data.videos || []).forEach((r) => grid.appendChild(makeCard(r)));
                    continuation = data.continuation || "";
                } catch (e) {
                    setStatus("Couldn't load channel.");
                    return;
                }
                loading = false;
                setStatus("");
                moreBtn.disabled = !continuation;
                moreBtn.textContent = continuation ? "More" : "No more";
            }

            moreBtn.addEventListener("click", () => loadMore(false));
            loadMore(true);
        </script>
    </body>
</html>
