<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Videos</title>
    <script src="{{ url_for('static', filename='js/global/cloaker.js') }}" defer></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: whitesmoke;
            background: #0c0c0c;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #151515;
            border-radius: 0.5rem;
            overflow: hidden;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .card a {
            display: block;
            padding: 0.75rem;
            color: whitesmoke;
            text-decoration: none;
        }
        .card a:hover {
            color: #ff9999;
        }
        .empty {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">Movie Library</div>
    <div class="grid">
        {{ range .movies }}
        <div class="card">
            <a href="/movie/{{ .file_id }}">
                <img src="{{ .thumb }}" alt="{{ .name }}" loading="lazy">
                <span>{{ .name }}</span>
            </a>
        </div>
        {{ else }}
        <div class="empty">No movies available.</div>
        {{ end }}
    </div>
</body>
</html>
